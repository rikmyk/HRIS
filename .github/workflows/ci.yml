name: HRIS CI Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  backend-lint-and-test:
    name: Go Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Download Dependencies
        run: cd backend && go mod download

      - name: Run Go Vet
        run: cd backend && go vet ./...

      - name: Run Unit Tests
        run: cd backend && go test -v -race -coverprofile=coverage.out ./...

  frontend-lint-and-check:
    name: Frontend & Mobile Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Workspace Setup
        run: echo "Frontend and Mobile checks ready for Phase 1 scaffolding."
